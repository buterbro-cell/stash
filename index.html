<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stash NFT</title>
<meta name="description" content="Tokenized NFTs on NEAR: a no-code collection builder with a body part generator, layer animation and tokens inside every NFT.">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: dark app shell — icon rail on desktop, tab bar on phones; soft raised panels; champagne-gold is the one accent for actions and active state */
:root{
  --bg:#0E0E10; --bg2:#17171A; --bg3:#212125; --bg4:#2A2A2F; --line:rgba(255,255,255,.07);
  --fg:#F4F2EE; --muted:#8F8D95; --gold1:#F6E6C6; --gold2:#E2C08E; --gold-text:#E8C896; --on-gold:#1A160F;
  --ok:#3DDC97; --warn:#FF6E6E; --violet:#B7A2FF;
  --grad:linear-gradient(100deg,var(--gold1) 0%,var(--gold2) 55%,#F1DDB6 100%);
  --f-display:"Manrope","Onest",system-ui,sans-serif;
  --f-body:"Manrope","Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:22px; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold2);outline-offset:2px;border-radius:8px}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.svgi{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* rail + top + tabbar */
.side{display:none}
@media (min-width:900px){
  .side{display:flex;flex-direction:column;align-items:center;gap:6px;position:fixed;left:0;top:0;bottom:0;width:84px;padding:calc(18px + env(safe-area-inset-top,0px)) 0 18px max(0px,env(safe-area-inset-left,0px));border-right:1px solid var(--line);background:var(--bg);z-index:25}
  .shell{margin-left:84px}
}
.side .logo{flex-direction:column;gap:4px;font-size:10px;letter-spacing:.06em;margin-bottom:18px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;font-weight:800;font-size:18px;letter-spacing:-.01em;min-height:44px}
.logo .mk{width:34px;height:34px;border-radius:11px;background:var(--grad);display:grid;place-items:center;color:var(--on-gold)}
.logo .mk .svgi{width:18px;height:18px;stroke-width:2.2}
.side .nav{display:flex;flex-direction:column;gap:4px}
.side .nav a{width:64px;min-height:58px;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-decoration:none;color:var(--muted);font-size:10.5px;font-weight:600;text-align:center;line-height:1.15}
.side .nav a:hover{color:var(--fg);background:var(--bg2)}
.side .nav a[aria-current="page"]{color:var(--gold-text);background:var(--bg2)}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.top .logo{display:flex}
@media (min-width:900px){ .top .logo{display:none} }
.search{flex:1;display:flex;align-items:center;gap:10px;min-height:46px;padding:0 16px;border-radius:999px;background:var(--bg3);color:var(--muted);min-width:0}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;color:var(--fg);font-size:15px}
.search input::placeholder{color:var(--muted)}
.search:focus-within{box-shadow:0 0 0 2px var(--gold2)}
@media (max-width:620px){ .top .search{display:none} }
.wallet{display:flex;align-items:center;gap:8px;font-size:14px}
.lang{display:inline-flex;gap:2px;padding:4px;border-radius:999px;background:var(--bg3);margin-left:auto;flex:none}
.lang button{min-width:42px;min-height:36px;border:0;border-radius:999px;background:none;color:var(--muted);font-weight:800;font-size:13px;letter-spacing:.04em;cursor:pointer}
.lang button:hover{color:var(--fg)}
.wallet .btn{white-space:nowrap}
@media (max-width:440px){ .top .lt{display:none} .wallet .btn-main{padding-inline:14px} }
.lang button[aria-pressed="true"]{background:var(--grad);color:var(--on-gold)}
.wpill{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:999px;background:var(--bg3);font-weight:700}
.wpill .svgi{color:var(--fg)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;display:grid;grid-template-columns:repeat(6,1fr);background:var(--bg2);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
.tabbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;text-decoration:none;color:var(--muted);font-size:10.5px;font-weight:600;min-width:0}
.tabbar a .svgi{width:22px;height:22px}
.tabbar a[aria-current="page"]{color:var(--gold-text)}
@media (min-width:900px){ .tabbar{display:none} }
@media (max-width:899px){ body{padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))} .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))!important} }

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 20px;border-radius:14px;border:1px solid transparent;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;background:var(--bg3);color:var(--fg);transition:filter .15s ease,transform .15s ease,border-color .15s ease}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:scale(.98)}
.btn-main{background:var(--grad);color:var(--on-gold)}
.btn-line{background:transparent;border-color:color-mix(in srgb,var(--gold2) 60%,transparent);color:var(--gold-text)}
.btn-sm{min-height:40px;padding:7px 14px;font-size:14px;border-radius:12px}
.btn-icon{min-height:38px;min-width:38px;padding:0;border-radius:12px;background:var(--bg3);border:0}
.btn[disabled]{opacity:.4;cursor:not-allowed;filter:none;transform:none}

.banner{font-size:12.5px;color:var(--muted)}
.banner .wrap{padding-block:2px 6px}
main{padding-block:20px 80px}
.sec{padding-block:44px}
.sec:first-child{padding-top:0}
.label{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.d-xl{font-weight:800;font-size:clamp(32px,4.8vw,58px);line-height:1.04;letter-spacing:-.03em}
.d-l{font-weight:800;font-size:clamp(26px,3.2vw,38px);line-height:1.1;letter-spacing:-.025em}
.d-m{font-weight:700;font-size:19px;line-height:1.3;letter-spacing:-.01em}
.lead{font-size:17px;color:var(--muted);max-width:60ch}
.prose{display:flex;flex-direction:column;gap:14px;max-width:66ch}
.prose p{color:var(--muted)}
.prose b{color:var(--fg);font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:10px}
.split{display:flex;flex-wrap:wrap;gap:32px;align-items:flex-start}
.split>.a{flex:1 1 420px;min-width:0;display:flex;flex-direction:column;gap:22px}
.split>.b{flex:1 1 340px;min-width:0;display:flex;flex-direction:column;gap:18px}
@media (min-width:920px){ .stick{position:sticky;top:84px} }

/* slides */
.slides{display:flex;gap:14px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slide{flex:0 0 min(100%,880px);scroll-snap-align:start;border-radius:26px;overflow:hidden;position:relative;min-height:300px;display:flex;flex-direction:column;justify-content:flex-end;gap:14px;padding:24px;text-decoration:none}
.slide.dark{background:var(--bg2)}
.slide.gold{background:var(--grad);color:var(--on-gold)}
.slide.green{background:linear-gradient(120deg,#0F2A22,#16392E 60%,#0F241D)}
.slide .strip{position:absolute;inset:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));align-content:start;gap:0}
.slide .strip .art{border-radius:0}
.slide .shade{position:absolute;inset:0;background:linear-gradient(0deg,rgba(14,14,16,.92) 0%,rgba(14,14,16,.35) 55%,rgba(14,14,16,0) 100%)}
.slide>*:not(.strip):not(.shade):not(.deco){position:relative}
.slide .deco{position:absolute;inset:0;pointer-events:none}
.slide.gold .deco{background:repeating-linear-gradient(115deg,transparent 0 120px,rgba(26,22,15,.08) 120px 121px)}
.slide.gold .lead{color:rgba(26,22,15,.72)}
.slide.green .lead{color:#A9C9BC}
.glass{display:inline-flex;flex-wrap:wrap;gap:0;border-radius:16px;background:rgba(20,20,22,.55);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);align-self:flex-start}
.glass div{padding:10px 16px;display:flex;flex-direction:column;gap:2px}
.glass div+div{border-left:1px solid rgba(255,255,255,.12)}
.glass span{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#B9B6BE}
.glass b{font-size:15px}
.dots{display:flex;justify-content:center;gap:8px;margin-top:12px}
.dots i{width:44px;height:4px;border-radius:9px;background:var(--bg4)}
.dots i.on{background:var(--gold2)}

/* art + cards */
.art{position:relative;aspect-ratio:1/1;max-width:100%;border-radius:16px;overflow:hidden;background:var(--bg3)}
.art canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.art .num{position:absolute;left:8px;top:8px;font-size:11px;font-weight:700;background:rgba(14,14,16,.7);color:#F4F2EE;border-radius:999px;padding:3px 9px;backdrop-filter:blur(6px)}
.art .flag{position:absolute;right:8px;top:8px;font-size:11px;font-weight:700;background:var(--grad);color:var(--on-gold);border-radius:999px;padding:3px 9px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.g4{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.gs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.tile{padding:0;border:0;background:none;cursor:pointer;border-radius:12px;display:block;width:100%}
.tile .art{border-radius:12px}
.tile:hover .art,.tile[aria-pressed="true"] .art{outline:2px solid var(--gold2);outline-offset:1px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
.card{display:flex;flex-direction:column;gap:10px;text-decoration:none;background:var(--bg2);border-radius:var(--r);padding:10px;transition:transform .2s ease,background .2s ease}
.card:hover{transform:translateY(-3px);background:#1C1C20}
.card .meta{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:0 6px;font-size:15px}
.card .meta span:first-child{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .meta span:last-child{color:var(--muted);font-size:13px;white-space:nowrap}
.pricebtn{display:flex;align-items:center;justify-content:center;gap:6px;min-height:42px;border-radius:13px;background:var(--grad);color:var(--on-gold);font-weight:800;font-size:15px}
.pricebtn.dim{background:var(--bg3);color:var(--muted);font-weight:600}
.rar{position:absolute;right:8px;bottom:8px;font-size:11.5px;font-weight:700;color:var(--violet);background:rgba(14,14,16,.72);border:1px solid rgba(255,255,255,.1);border-radius:999px;padding:3px 9px}

/* chips + list rows */
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:transparent;cursor:pointer;font-weight:700;font-size:14.5px;color:var(--fg)}
.chips button[aria-pressed="true"]{background:var(--bg3);border-color:var(--bg3)}
.rows{display:flex;flex-direction:column;gap:10px}
.crow{display:flex;align-items:center;gap:14px;padding:12px 16px 12px 12px;border-radius:20px;background:var(--bg2);text-decoration:none;transition:background .15s ease}
.crow:hover{background:#1D1D21}
.crow .av{width:58px;flex:none;border-radius:14px}
.crow .av .art{border-radius:14px}
.crow .mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.crow .mid b{font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow .mid span{font-size:14px;color:var(--muted)}
.crow .end{text-align:right;display:flex;flex-direction:column;gap:2px;flex:none}
.crow .end b{font-size:16px}
.crow .end span{font-size:13.5px;color:var(--muted)}
.tagp{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;color:var(--gold-text)}

.kinds{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.kind{padding:22px;display:flex;flex-direction:column;gap:10px;background:var(--bg2);border-radius:var(--r)}
.kind .ic{width:44px;height:44px;border-radius:14px;background:var(--bg3);display:grid;place-items:center;color:var(--gold-text)}
.kind p{color:var(--muted);font-size:15px}
.eq{display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 14px;font-weight:800;font-size:clamp(24px,3vw,38px);letter-spacing:-.02em}
.eq span{display:inline-flex;flex-direction:column;align-items:center;gap:2px}
.eq small{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:0}
.eq .op{color:var(--muted);font-weight:400}
.eq span:last-child{color:var(--gold-text)}

/* form */
#cf{counter-reset:st;display:flex;flex-direction:column;gap:14px}
.step{display:flex;flex-direction:column;gap:16px;padding:22px;border-radius:var(--r);background:var(--bg2);counter-increment:st}
.step-h{display:flex;align-items:center;gap:12px}
.step-h .n{width:28px;height:28px;border-radius:9px;background:var(--grad);color:var(--on-gold);display:grid;place-items:center;font-size:13px;font-weight:800;flex:none}
.step-h .n::before{content:counter(st)}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.field>.lbl{font-size:13px;color:var(--muted);font-weight:600}
.input{width:100%;min-height:46px;padding:9px 14px;border-radius:14px;border:1px solid transparent;background:var(--bg3);color:var(--fg)}
.input:focus{outline:none;border-color:var(--gold2)}
.input[disabled]{color:var(--muted);background:var(--bg)}
.input.sm{min-height:38px;padding:6px 12px;font-size:14px;border-radius:12px}
.hint{font-size:13px;color:var(--muted)}
.err{font-size:14px;color:var(--warn)}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px;align-self:flex-start}
.seg button{min-height:42px;padding:0 16px;border-radius:999px;border:1px solid var(--line);background:none;cursor:pointer;font-size:14px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--bg3);border-color:var(--bg3);color:var(--gold-text)}
.opt{display:flex;gap:14px;align-items:flex-start;padding:16px;border:1px solid var(--line);border-radius:18px;cursor:pointer;background:var(--bg)}
.opt:has(input:checked){border-color:var(--gold2)}
.opt input{width:20px;height:20px;margin-top:2px;accent-color:var(--gold2);flex:none}
.opt b{font-weight:700}
.opt p{font-size:14px;color:var(--muted)}
input[type=range]{width:100%;accent-color:var(--gold2);min-height:30px}
input[type=color]{width:100%;min-height:46px;padding:4px;border-radius:14px;border:0;background:var(--bg3);cursor:pointer}
.advice{background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px;font-size:14.5px}
.advice b{font-weight:800;color:var(--gold-text)}
.chiprow{display:flex;flex-wrap:wrap;gap:6px}
.chiprow span{font-size:12.5px;font-weight:600;background:var(--bg3);border-radius:999px;padding:4px 11px}
.chiprow .ok{color:var(--ok)}
.chiprow .bad{color:var(--warn)}
.presets{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:6px}
.presets div{background:var(--bg3);border-radius:12px;padding:8px 11px;font-size:12.5px;color:var(--muted)}
.presets b{display:block;font-size:13.5px;color:var(--fg)}
.layers{display:flex;flex-direction:column;gap:12px}
.layer{background:var(--bg);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:12px}
.layer-h{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.layer-h .input{flex:1 1 140px;width:auto}
.layer-h select.input{flex:0 1 170px}
.layer-h .cnt{font-size:12px;font-weight:700;color:var(--muted);min-width:24px;text-align:right}
.vars{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.var{display:flex;flex-direction:column;gap:5px;min-width:0;position:relative}
.var .art{border-radius:12px}
.var .vn{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.var select{font-size:12px;min-height:32px;padding:4px 6px;border-radius:9px;border:0;background:var(--bg3);width:100%}
.var .pct{font-size:11px;font-weight:700;color:var(--violet)}
.var .x{position:absolute;right:5px;top:5px;width:26px;height:26px;border-radius:9px;border:0;background:rgba(14,14,16,.75);color:#fff;cursor:pointer;display:grid;place-items:center;z-index:2}
.var .x .svgi{width:14px;height:14px}
.add-var{display:grid;place-items:center;aspect-ratio:1/1;border:1px dashed rgba(226,192,142,.45);border-radius:12px;cursor:pointer;color:var(--gold-text);font-size:12.5px;font-weight:700;text-align:center;padding:6px}
.add-var:hover{background:var(--bg2)}
.sr{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.editor{border:1px solid var(--gold2);border-radius:18px;padding:16px;display:flex;flex-wrap:wrap;gap:20px;background:var(--bg)}
.editor .ea{flex:0 1 200px;min-width:160px}
.editor .eb{flex:1 1 240px;min-width:0;display:flex;flex-direction:column;gap:10px}
.pager{display:flex;align-items:center;gap:10px;font-size:14px;flex-wrap:wrap}

.sum{display:flex;flex-direction:column;background:var(--bg2);border-radius:var(--r);padding:6px 18px}
.sr-row{display:flex;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14.5px}
.sr-row:last-child{border-bottom:0}
.sr-row b{font-weight:700;text-align:right}
.sr-row small{display:block;font-size:12.5px;color:var(--muted)}
.sr-row.total b{color:var(--gold-text);font-size:17px}
.sr-row.total{border-bottom:0}
.big-ok{color:var(--ok)}
.big-bad{color:var(--warn)}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.stat{background:var(--bg2);border-radius:16px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.stat span{font-size:11.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stat b{font-weight:800;font-size:18px}
.prog{height:6px;border-radius:999px;background:var(--bg3);overflow:hidden}
.prog i{display:block;height:100%;background:var(--grad)}
.traits{display:flex;flex-direction:column;background:var(--bg2);border-radius:18px;padding:4px 16px}
.trait{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
.trait:last-child{border-bottom:0}
.trait span:first-child{color:var(--muted)}
.trait .mono{color:var(--violet)}
.box{background:var(--bg2);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:14px}
.box .stat{background:var(--bg3)}
.inline{display:flex;flex-wrap:wrap;gap:8px}
.inline .input{flex:1 1 120px;width:auto}
.note{font-size:14px;padding:12px 14px;border-radius:14px;background:var(--bg3)}
.note.warn{color:var(--warn)}
.note.ok{color:var(--ok)}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);text-decoration:none;font-size:14px;font-weight:600;min-height:44px;margin-bottom:10px}
.back:hover{color:var(--fg)}

.toc{display:flex;flex-direction:column;gap:2px;background:var(--bg2);border-radius:18px;padding:10px 16px}
.toc a{color:var(--muted);text-decoration:none;font-size:14px;font-weight:600;padding:7px 0}
.toc a:hover{color:var(--gold-text)}
.gsec{display:flex;flex-direction:column;gap:16px;padding:26px;border-radius:var(--r);background:var(--bg2);margin-bottom:14px;scroll-margin-top:84px}
.cmp{width:100%;border-collapse:collapse;font-size:14.5px}
.cmp th,.cmp td{text-align:left;padding:12px 10px 12px 0;border-bottom:1px solid var(--line);vertical-align:top}
.cmp th{font-weight:700;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tw{overflow-x:auto}
.uses{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.use{background:var(--bg3);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px}
.use p{font-size:14px;color:var(--muted)}
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:16px;padding:32px;background:var(--bg2);border-radius:var(--r)}
footer{font-size:13px;color:var(--muted)}
footer .wrap{padding-block:16px 32px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;pointer-events:none;background:var(--grad);color:var(--on-gold);font-weight:700;padding:12px 18px;border-radius:14px;font-size:14px;transition:all .2s ease;z-index:40;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:520px){ .wname{display:none} }
.inside{display:flex;align-items:center;gap:6px;padding:0 6px;font-size:13px;font-weight:700;color:var(--gold-text);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inside.dim{color:var(--muted);font-weight:600}
.inside .svgi{width:15px;height:15px}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.fcard{background:var(--bg2);border-radius:var(--r);padding:22px;display:flex;flex-direction:column;gap:10px}
.fcard .nb{width:30px;height:30px;border-radius:10px;background:var(--grad);color:var(--on-gold);display:grid;place-items:center;font-weight:800;font-size:14px}
.fcard p{color:var(--muted);font-size:15px}
.tbar{display:flex;height:52px;border-radius:14px;overflow:hidden;font-weight:800;font-size:14px}
.tbar div{display:flex;align-items:center;padding:0 14px;white-space:nowrap}
.tbar .a{background:var(--bg3);flex:0 0 70%}
.tbar .b{background:var(--grad);color:var(--on-gold);flex:1}
.var .lk{position:absolute;left:5px;top:5px;width:26px;height:26px;border-radius:9px;border:0;background:rgba(14,14,16,.75);color:#fff;cursor:pointer;display:grid;place-items:center;z-index:2}
.var .lk[aria-pressed="true"]{background:var(--grad);color:var(--on-gold)}
.var .lk .svgi{width:14px;height:14px}
.soon{display:flex;gap:12px;align-items:flex-start;padding:16px;border-radius:18px;border:1px dashed rgba(226,192,142,.4);color:var(--muted);font-size:14.5px}
.soon b{color:var(--gold-text)}
@media (prefers-reduced-motion: reduce){ *{transition:none!important} }

  'Токенизированная NFT — это NFT, внутри которой лежат токены:':'A tokenized NFT is an NFT that holds tokens inside:',
  'NEAR или любой токен NEAR, например ваш мемкоин. Здесь это называется «наполнение».':'NEAR or any NEAR token, such as your memecoin. On this site we call it the NFT’s “contents”.',
  'Представьте подарочную коробку. Обычная NFT — это пустая красивая коробка: она стоит столько, сколько за неё кто-то готов заплатить. Пропал интерес — коробка стоит ноль.':'Picture a gift box. A regular NFT is a beautiful empty box: it’s worth whatever someone will pay for it. When interest fades, the box is worth nothing.',
  'NFT с наполнением — это':'An NFT with tokens inside is','коробка, внутри которой лежат монеты':'a box with coins in it','. Даже если коробка никому не нужна, монеты можно достать. Поэтому дешевле содержимого такая NFT не станет.':'. Even if nobody wants the box, the coins can still be taken out. So such an NFT is never worth less than what it holds.',

  'Вы указываете, сколько NFT хотите, и конструктор подсказывает, сколько вариантов нарисовать. Считаем с запасом в полтора раза, чтобы работала редкость:':'You say how many NFTs you want, and the builder tells you how many variants to draw. We count with 1.5× headroom so rarity works:',

  'Например, для 1 000 NFT хватит 5 фонов, 5 фигур, 5 глаз, 5 шапок и 5 аксессуаров. Слоёв больше — вариантов в каждом нужно меньше.':'For example, 1,000 NFTs need just 5 backgrounds, 5 shapes, 5 eyes, 5 hats and 5 accessories. More layers means fewer variants per layer.',

function frame(ts){

    const b = c.getBoundingClientRect(); if(b.bottom < 0 || b.top > vh || !b.width) continue;
    const W = Math.round(b.width*dpr), H = Math.round(b.height*dpr);
    if(c.width !== W || c.height !== H){ c.width = W; c.height = H; }
    const res = resolve(c); if(!res) continue;
    const ctx = c.getContext('2d'); ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha = 1;
    try{ drawToken(ctx, W, H, t, res.art, res.dna, res.idx); }catch(e){}

  return `<a class="back" href="#explore">${IC.back} Коллекции</a>
  <section class="split">
    <div class="a">

      <h1 class="d-l">${esc(c.name)}</h1>
      <div class="stats">
        ${keep ? '' : `<div class="stat"><span>Цена</span><b>${fmt(c.price)} NEAR</b></div>`}
        <div class="stat"><span>Всего</span><b>${fmt(c.supply,0)}</b></div>
        <div class="stat"><span>Роялти</span><b>${fmt(c.royalty)}%</b></div>

      </div>

      : `<div style="display:flex;flex-direction:column;gap:8px">
        <div class="row" style="justify-content:space-between;font-size:14px"><span class="muted">Сминчено</span><span class="mono">${fmt(c.minted,0)} / ${fmt(c.supply,0)}</span></div>

      <div class="row"><button class="btn btn-main" id="mint" type="button" ${sold ? 'disabled' : ''}>${sold ? 'Все NFT разобраны' : 'Сминтить за ' + fmt(c.price) + ' NEAR'}</button></div>

      : `<div class="art">${cv(c.id, i+1)}<span class="num">#${i+1}</span></div>`).join('')}</div>
  </section>`;

function traitsOf(c, idx){
  if(c.art.mode === 'files'){ const f = (c.art.files || [])[idx-1]; return f && f.traits ? f.traits.map(([k, v]) => `<div class="trait"><span>${esc(k)}</span><span>${esc(v)}</span></div>`).join('') : ''; }
  if(c.art.mode !== 'layers' || !c.dna) return '';
  const d = c.dna[idx-1];
  if(d && !Array.isArray(d)) return `<div class="trait"><span>Тип</span><span>Легендарка 1 из 1</span></div>`;
  if(!d) return '';
  return c.art.layers.map((L, li) => { const v = L.variants[d[li]]; if(!v) return '';
    const tot = L.variants.reduce((s, x) => s + x.w, 0);
    return `<div class="trait"><span>${esc(L.name)}</span><span>${esc(v.label)} <span class="muted mono">${fmt(v.w/tot*100, 1)}%</span></span></div>`; }).join('');
}

function adviceHTML(){

  const pres = [333, 1000, 3333, 10000].map(m => `<div><b>${fmt(m,0)} NFT</b>по ${perLayerNeed(m, L)} в слое</div>`).join('');
  return `<p><b>Совет:</b> для ${fmt(n,0)} NFT из ${L} ${L === 1 ? 'слоя' : 'слоёв'} нарисуйте примерно по <b>${k}</b> вариантов в каждом слое. Это ${fmt(Math.pow(k, L),0)} сочетаний — с запасом, чтобы работала редкость.</p>

}

const PER = 30;

    <div class="pager" style="margin-top:10px"><button class="btn btn-line btn-sm" type="button" id="pg-prev" ${d.galPage === 0 ? 'disabled' : ''} aria-label="Назад">${IC.back}</button><span class="mono">${d.galPage+1} / ${pages}</span><button class="btn btn-line btn-sm" type="button" id="pg-next" ${d.galPage >= pages-1 ? 'disabled' : ''} aria-label="Вперёд">${IC.arrow}</button><span class="hint">${fmt(all.length,0)} NFT${d.edits ? ' · правок вручную: ' + d.edits : ''}</span></div>`

  if(nx) nx.onclick = () => { d.galPage++; renderGallery(); };
  collect();
}
function renderEditor(){
  const d = S.draft, box = $('#editor'); if(!box) return;
  const all = draftAll();
  if(editIdx === null || editIdx >= all.length){ box.innerHTML = ''; collect(); return; }
  const x = all[editIdx];
  if(!Array.isArray(x)){
    box.innerHTML = `<div class="editor"><div class="ea"><div class="art">${cv('edit', 0)}</div></div><div class="eb"><h3 class="d-m">Легендарка 1 из 1</h3><p class="hint">${esc(d.legends[x.l].label)}. При запуске получит случайный номер в коллекции.</p>
      <div class="row"><button class="btn btn-line btn-sm" type="button" id="leg-del">Удалить легендарку</button><button class="btn btn-line btn-sm" type="button" id="ed-close">Закрыть</button></div></div></div>`;
    $('#leg-del').onclick = () => { removeLegend(x.l); };
    $('#ed-close').onclick = () => { editIdx = null; renderGallery(); renderEditor(); };

  }
  box.innerHTML = `<div class="editor"><div class="ea"><div class="art">${cv('edit', 0)}<span class="num">#${editIdx+1}</span></div></div>
    <div class="eb"><h3 class="d-m">NFT #${editIdx+1}</h3>
      ${d.layers.map((L, li) => `<div class="field"><label for="ed-${li}">${esc(L.name)}</label><select class="input sm" id="ed-${li}" data-ed="${li}">${L.variants.map((v, vi) => `<option value="${vi}" ${x[li]===vi?'selected':''}>${esc(v.label)}</option>`).join('')}</select></div>`).join('')}

    </div></div>`;
  const setDNA = nd => {

    d.dna[editIdx] = nd; d.edits++; save(); renderGallery(); renderEditor(); return true;

  $('#ed-close').onclick = () => { editIdx = null; renderGallery(); renderEditor(); };

function renderLegends(){
  const d = S.draft, box = $('#legends'); if(!box) return;
  box.innerHTML = d.legends.map((g, i) => `<div class="var"><div class="art">${cv('leg', i)}<button class="x" type="button" data-legdel="${i}" aria-label="Удалить легендарку">${IC.x}</button></div><span class="vn">${esc(g.label)}</span></div>`).join('')
    + `<label class="add-var" for="up-leg">+ Легендарки</label><input class="sr" id="up-leg" type="file" accept="image/png,image/webp,image/jpeg" multiple>`;
  $$('[data-legdel]').forEach(b => b.onclick = () => removeLegend(+b.dataset.legdel));
  $('#up-leg').onchange = ev => readFiles(ev.target.files, items => {
    const room = Math.max(0, draftSupply() - 1 - d.legends.length);
    items.slice(0, room).forEach(it => { d.legends.push(it); if(d.dna && d.dna.length > draftSupply() - d.legends.length) d.dna.pop(); });
    if(items.length > room) toast('Легендарок не может быть больше, чем NFT в коллекции');
    afterDraft(false);
  });
  collect();
}
function removeLegend(i){
  const d = S.draft; d.legends.splice(i, 1); editIdx = null;
  const need = draftSupply() - d.legends.length;
  if(d.dna && d.dna.length < need){
    const seen = new Set(d.dna.map(o => o.join('.'))), fresh = genDNA(d.layers, Math.min(need + 50, combos(d.layers)), d.seed + 101);
    for(const o of fresh){ if(d.dna.length >= need) break; if(!seen.has(o.join('.'))){ d.dna.push(o); seen.add(o.join('.')); } }
  }
  afterDraft(false);
}
let fEdit = null, fBusy = false, fErr = '';

    : `<p class="hint">Это обычная картинка без AI-признаков. Признаки можно менять у NFT, нарисованных в AI-генераторе.</p><div class="row"><button class="btn btn-line btn-sm" type="button" id="fe-close">Готово</button></div>`}

    if(clash){ fErr = 'Такая NFT уже есть в коллекции. Выберите другое сочетание.'; renderFEditor(); return; }

    try{ const it = await aiDrawItem(vals, c.items.find(x => x.id === f.aiId) || null, ch); Object.assign(f, aiFileFrom(it, fEdit), {label:f.label}); save(); toast('NFT перерисована'); }

function renderFiles(){
  const d = S.draft, box = $('#files'); if(!box) return;
  box.innerHTML = d.files.map((f, i) => `<div class="var"><button class="tile" type="button" data-fedit="${i}" aria-pressed="${fEdit === i}" aria-label="Изменить NFT ${i+1}"><div class="art">${cv('file', i)}<span class="num">#${i+1}</span></div></button><div><button class="x" type="button" data-fdel="${i}" aria-label="Удалить картинку ${i+1}">${IC.x}</button></div></div>`).join('')
    + `<label class="add-var" for="up-files">+ Картинки</label><input class="sr" id="up-files" type="file" accept="image/png,image/webp,image/jpeg,image/gif" multiple>`;

  $$('[data-fdel]').forEach(b => b.onclick = () => { d.files.splice(+b.dataset.fdel, 1); fEdit = null; afterDraft(false); });
  renderFEditor();
  $('#up-files').onchange = ev => readFiles(ev.target.files, items => { d.files.push(...items.slice(0, Math.max(0, 10000 - d.files.length))); afterDraft(false); });

function readFiles(fileList, done){
  const files = [...(fileList || [])]; if(!files.length) return;
  const ok = files.filter(f => f.size <= 2*1024*1024), skipped = files.length - ok.length, out = new Array(ok.length);
  let left = ok.length; if(!left){ toast('Файлы больше 2 МБ пропущены'); return; }
  ok.forEach((f, i) => { const rd = new FileReader();
    rd.onload = () => { out[i] = {src:rd.result, label:f.name.replace(/\.[^.]+$/, '').slice(0, 28)}; fin(); };
    rd.onerror = fin; rd.readAsDataURL(f); });
  function fin(){ if(--left === 0){ done(out.filter(Boolean)); if(skipped) toast('Файлы больше 2 МБ пропущены'); } }
}

function updateSide(){
  const d = S.draft, keep = d.release === 'keep', price = num(d.price) || 0, supply = draftSupply();
  const fillN = d.fill.on ? r2(price*d.fill.pct/100) : 0, you = r2(price - fillN);
  const cmb = d.mode === 'layers' ? combos(d.layers) + d.legends.length : d.mode === 'files' ? d.files.length : Infinity;
  const enough = cmb >= supply && supply > 0;
  const mintAll = r2(supply*MINT_COST), fillAll = r2(supply*fillN);
  $('#roy-v').textContent = d.royalty + '%'; $('#pct-v').textContent = d.fill.pct + '%';
  $('#fill-box').hidden = !d.fill.on; $('#tok-box').hidden = !d.fill.tokOn;
  ['layers','files','algo'].forEach(m => { $('#mode-' + m).hidden = d.mode !== m; });
  $('#step-review').hidden = d.mode !== 'layers';
  $$('[data-mode]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.mode === d.mode)));
  $$('[data-algo]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.algo === d.algo.style)));
  const sup = $('#f-sup'); sup.disabled = d.mode === 'files'; if(d.mode === 'files') sup.value = d.files.length;
  $('#sup-hint').textContent = d.mode === 'files' ? 'Равно числу загруженных картинок' : 'От 1 до 10 000';
  $('#price-field label').textContent = keep ? 'Цена минта, NEAR (для расчёта наполнения)' : 'Цена минта, NEAR';
  if(d.mode === 'layers') $('#advice').innerHTML = adviceHTML();
  const tokPer = Math.floor(num(d.fill.tokPer)) || 0, tsym = d.fill.tokSym || 'токенов';
  const nowPay = r2(DEPLOY_COST + (keep ? mintAll + fillAll : 0));
  $('#sum').innerHTML = `
    <div class="sr-row"><span>${d.mode === 'files' ? 'Картинок загружено' : 'Возможных вариантов'}</span><b class="${enough ? 'big-ok' : 'big-bad'}">${cmb === Infinity ? 'без ограничений' : fmt(cmb,0)}</b></div>
    <div class="sr-row"><span>NFT в коллекции</span><b>${fmt(supply,0)}</b></div>
    <div class="sr-row"><span>Запуск контракта<small>платите вы, один раз</small></span><b>≈ 3–5 NEAR</b></div>
    <div class="sr-row"><span>Чеканка ≈ ${fmt(MINT_COST)} NEAR за NFT<small>${keep ? 'платите вы за всю коллекцию' : 'платит покупатель при минте'}</small></span><b>${keep ? '≈ ' + fmt(mintAll) + ' NEAR' : '0 NEAR'}</b></div>
    ${d.fill.on ? `<div class="sr-row"><span>Внутри каждой NFT<small>${keep ? 'кладёте вы' : 'из цены минта'}</small></span><b>${fmt(fillN)} NEAR${d.fill.tokOn ? ' + ' + fmt(tokPer,0) + ' ' + esc(tsym) : ''}</b></div>` : ''}
    ${d.fill.on && keep ? `<div class="sr-row"><span>Наполнение всей коллекции</span><b>${fmt(fillAll)} NEAR</b></div>` : ''}
    ${d.fill.on && d.fill.tokOn ? `<div class="sr-row"><span>Токенов на всю коллекцию</span><b>${fmt(tokPer*supply,0)} ${esc(tsym)}</b></div>` : ''}
    ${keep ? '' : `<div class="sr-row"><span>Вам с каждого минта</span><b>${fmt(you)} NEAR</b></div>
    <div class="sr-row"><span>Если разберут все</span><b>${fmt(you*supply)} NEAR</b></div>`}
    <div class="sr-row total"><span>Заплатить при запуске</span><b>≈ ${fmt(nowPay)} NEAR</b></div>
    ${!enough && supply > 0 ? `<p class="note warn" style="margin-top:10px">${d.mode === 'files' ? 'Загрузите картинки.' : 'Вариантов меньше, чем NFT. Добавьте картинок в слои или уменьшите количество.'}</p>` : ''}
    <p class="hint" style="padding-top:10px">Сетевые цены — предварительная оценка, уточним после написания контракта.</p>`;
}

function readBasics(){
  const d = S.draft;
  d.name = $('#f-name').value; d.symbol = $('#f-sym').value.toUpperCase().trim(); if(d.mode !== 'files') d.supply = $('#f-sup').value; d.price = $('#f-pr').value;

  d.fill.tokAddr = $('#f-ta').value.trim(); d.fill.tokSym = $('#f-ts').value.toUpperCase().trim(); d.fill.tokPer = $('#f-tp').value;
  d.algo.c1 = $('#f-c1').value; d.algo.c2 = $('#f-c2').value; d.fileAnim = $('#f-fanim').value;
  const r = $('input[name="release"]:checked'); d.release = r ? r.value : 'list';

function bindLayers(){
  const L = S.draft.layers;
  $$('[data-lname]').forEach(el => el.oninput = () => { L[+el.dataset.lname].name = el.value; save(); });
  $$('[data-lanim]').forEach(el => el.onchange = () => { L[+el.dataset.lanim].anim = el.value; save(); });
  $$('[data-lup]').forEach(el => el.onclick = () => { const i = +el.dataset.lup; if(i < L.length-1){ [L[i], L[i+1]] = [L[i+1], L[i]]; afterDraft(true); } });
  $$('[data-ldown]').forEach(el => el.onclick = () => { const i = +el.dataset.ldown; if(i > 0){ [L[i], L[i-1]] = [L[i-1], L[i]]; afterDraft(true); } });
  $$('[data-ldel]').forEach(el => el.onclick = () => { L.splice(+el.dataset.ldel, 1); afterDraft(true); });
  $$('[data-vdel]').forEach(el => el.onclick = () => { const [li, vi] = el.dataset.vdel.split('-').map(Number); L[li].variants.splice(vi, 1); afterDraft(true); });
  $$('[data-vw]').forEach(el => el.onchange = () => { const [li, vi] = el.dataset.vw.split('-').map(Number); L[li].variants[vi].w = +el.value; afterDraft(true); });
  $$('[data-up]').forEach(el => el.onchange = () => { const li = +el.dataset.up;
    readFiles(el.files, items => { items.forEach(it => L[li].variants.push({id:uid(), kind:'img', src:it.src, label:it.label, w:10})); afterDraft(true); }); });
}
function afterDraft(rebuild){
  if(rebuild) rebuildDNA();
  renderLayers(); renderGallery(); renderEditor(); renderLegends(); renderFiles(); updateSide(); save();
}

function validate(){
  const d = S.draft, e = [], sup = draftSupply(), pr = num(d.price);
  if(!d.name.trim()) e.push('Укажите название коллекции.');
  if(!/^[A-Z0-9]{2,8}$/.test(d.symbol)) e.push('Тикер: от 2 до 8 латинских букв или цифр.');
  if(d.mode === 'files'){ if(!d.files.length) e.push('Загрузите хотя бы одну картинку.'); }
  else if(!(Number.isInteger(num(d.supply)) && sup >= 1 && sup <= 10000)) e.push('Количество: целое число от 1 до 10 000.');
  if(!(pr >= 0)) e.push('Укажите цену минта (0 — бесплатно).');
  if(d.fill.on && !(pr > 0)) e.push('Для наполнения укажите цену минта больше нуля: от неё считается сумма внутри.');
  if(d.mode === 'layers'){
    if(!d.layers.length) e.push('Добавьте хотя бы один слой.');
    d.layers.forEach(L => { if(!L.variants.length) e.push(`В слое «${L.name}» нет картинок. Добавьте их или удалите слой.`); });
    if(draftAll().length < sup) e.push(`Собрано только ${fmt(draftAll().length,0)} разных NFT из ${fmt(sup,0)}. Добавьте вариантов в слои.`);
  }
  if(d.fill.on && d.fill.tokOn){
    if(!d.fill.tokAddr) e.push('Укажите адрес токена.');
    if(!d.fill.tokSym) e.push('Укажите тикер токена.');
    if(!(Math.floor(num(d.fill.tokPer)) > 0)) e.push('Укажите, сколько токенов класть в каждую NFT.');
  }
  return e;
}

function bindCreate(){
  if(S.draft.mode === 'layers' && (!S.draft.dna || S.draft.dna.length + S.draft.legends.length !== Math.min(draftSupply(), combos(S.draft.layers) + S.draft.legends.length))) rebuildDNA();
  afterDraft(false);
  const f = $('#cf');
  let lastSup = S.draft.supply;
  const on = () => { readBasics(); if(S.draft.supply !== lastSup){ lastSup = S.draft.supply; rebuildDNA(); renderGallery(); renderEditor(); } updateSide(); save(); };
  f.addEventListener('input', ev => { if(ev.target.closest('.layer, .editor, #legends, #files')) return; on(); });
  f.addEventListener('change', ev => { if(ev.target.closest('.layer, .editor, #legends, #files')) return; on(); });
  f.addEventListener('submit', ev => ev.preventDefault());
  $$('[data-mode]').forEach(b => b.onclick = () => { S.draft.mode = b.dataset.mode; editIdx = null; S.draft.previewOff = 0; afterDraft(true); });

function launch(){
  readBasics(); const errs = validate(); $('#lerr').innerHTML = errs.map(esc).join('<br>'); if(errs.length) return;
  const d = S.draft, sup = draftSupply(), keep = d.release === 'keep', price = r2(num(d.price) || 0);
  const fillN = d.fill.on ? r2(price*d.fill.pct/100) : 0;
  const cost = r2(DEPLOY_COST + (keep ? sup*MINT_COST + sup*fillN : 0));
  if(!S.wallet) connect();
  if(S.near < cost){ $('#lerr').textContent = `Не хватает NEAR в демо-кошельке: нужно ≈ ${fmt(cost)}, на балансе ${fmt(S.near)}. Пополнить демо-баланс можно в разделе «Мои NFT».`; return; }
  let dna = null, art;
  if(d.mode === 'layers'){
    dna = draftAll().slice(0, sup);
    const r = rng(d.seed + 7); for(let i = dna.length - 1; i > 0; i--){ const j = Math.floor(r()*(i+1)); [dna[i], dna[j]] = [dna[j], dna[i]]; }

  } else if(d.mode === 'files') art = {mode:'files', files:d.files.slice(), anim:d.fileAnim};
  else art = {mode:'algo', algo:{...d.algo}};
  S.near = r2(S.near - cost);
  const id = 'c' + Date.now().toString(36);
  S.collections.unshift({id, name:d.name.trim(), symbol:d.symbol, supply:sup, minted: keep ? sup : 0, price, royalty:d.royalty,
    creator:S.wallet, sample:false, release:d.release, art, dna,
    fill: d.fill.on ? {on:true, pct:d.fill.pct, near:fillN, tokOn:d.fill.tokOn, tokAddr:d.fill.tokAddr, tokSym:d.fill.tokSym, tokPer:Math.floor(num(d.fill.tokPer)) || 0} : {on:false}});
  S.draft = newDraft(); editIdx = null; save(); renderWallet();
  toast(keep ? `Отчеканено ${fmt(sup,0)} NFT в ваш кошелёк (демо)` : 'Коллекция запущена (демо)');
  location.hash = 'col-' + id;
}

    const cand = c.traits.map((t, i) => ({t, i, pool:(poolFor(t.name) || []).filter(x => !t.variants.some(v => v.label === x))})).filter(o => o.pool.length).sort((a, b) => a.t.variants.length - b.t.variants.length)[0];
    if(!cand) break; cand.t.variants.push(TV(cand.pool[0])); added++;
  }
  save(); renderAI();
  toast(added ? `Добавлено вариантов: ${added}` : 'Добавьте варианты вручную: для этих признаков нет готовых подсказок');
}

function bindAIBox(){

  $$('[data-tdel]').forEach(b => b.onclick = () => { if(c.traits.length <= 1){ toast('Нужен хотя бы один признак'); return; } c.traits.splice(+b.dataset.tdel, 1); c.items = []; save(); renderAI(); toast('Признак удалён, нарисованные NFT сброшены'); });

    try{ const others = aiChars().length ? ' Make this a new, different character from the same collection: same art style, different face and look.' : '';
      const img = await aiImage(`${c.style}. One single character, front view, upper body portrait, centered, simple plain light background, clean NFT avatar style. No text, no watermark.` + others + (c.refs.length ? REF_NOTE : ''), c.refs);
      const src = await shrink(img, 768), id = 'c' + uid(); AIMG.set(charKey(id), src); await IDB.put(charKey(id), src); aiChars().push({id}); c.active = id; }catch(e){ AI.log.push(e.message); }
    AI.busy = false; save(); renderAI(); };

    c.chars = aiChars().filter(x => x.id !== id); c.items = c.items.filter(x => x.char !== id); IDB.del(charKey(id)); AIMG.delete(charKey(id)); save(); renderAI(); if(n) toast(`Персонаж удалён вместе с его NFT: ${n}`); });
  const pc = $('#ai-pick-char'); if(pc) pc.onchange = () => { c.active = pc.value; save(); renderAI(); };
  const oa = $('#ai-only'); if(oa) oa.onchange = () => { c.onlyActive = oa.checked; save(); };
  const b1 = $('#ai-one'); if(b1) b1.onclick = () => { const vals = c.traits.map((t, ti) => +($('#ai-pick-' + ti) || {}).value || 0); aiRun([() => aiDrawItem(vals, null, c.active)]); };

  $$('[data-iredo]').forEach(b => b.onclick = () => { const it = c.items.find(x => x.id === b.dataset.iredo); if(it) aiRun([() => aiDrawItem(it.vals, it)]); });

  const mo = $('#ai-more'); if(mo) mo.onclick = () => { AI.show += 48; renderAI(); };

function aiSend(){
  { const c = aiCfg(), d = S.draft, ready = c.items.filter(it => AIMG.get(it.id));
    if(!ready.length){ toast('Картинки ещё загружаются, подождите секунду'); return; }
    d.mode = 'files'; d.fileAnim = 'none';
    d.files = ready.map((it, i) => aiFileFrom(it, i));
    editIdx = null; save(); toast('NFT перенесены в конструктор'); location.hash = 'create';
  }
}
function aiFileFrom(it, i){ const c = aiCfg(); return {src:AIMG.get(it.id), label:'#' + (i + 1), aiId:it.id, char:it.char, vals:it.vals.slice(),
  traits:[['Персонаж', charName(it.char)]].concat(c.traits.map((t, ti) => [t.name, t.variants[it.vals[ti]] ? t.variants[it.vals[ti]].label : '—']))}; }
async function aiMigrate(){
  const c = aiCfg(); if(c.chars && c.chars.length) return;
  const old = await IDB.get('base');
  if(old){ const id = 'c' + uid(); await IDB.put(charKey(id), old); AIMG.set(charKey(id), old); c.chars = [{id}]; c.active = id; c.items.forEach(it => { if(!it.char) it.char = id; }); save(); }
}
async function bindAI(){
  const c = aiCfg(); renderAI(); await aiStatus(); await aiMigrate();
  await Promise.all(aiChars().map(ch => charImg(ch.id)));
  await Promise.all(c.items.filter(it => !AIMG.get(it.id)).map(async it => { const s = await IDB.get(it.id); if(s) AIMG.set(it.id, s); }));
  renderAI();
}

function bindGen(){
  $$('[data-gtab]').forEach(b => b.onclick = () => { S.gen.tab = b.dataset.gtab; save(); route(); });
  if((S.gen.tab || 'ai') === 'ai'){ bindAI(); return; }
  const G = S.gen, rerender = () => { genPreview(); save(); const y = scrollY; route(); scrollTo(0, y); };
  $$('[data-pal]').forEach(b => b.onclick = () => { G.pal = b.dataset.pal; G.seed = Math.floor(Math.random()*1e6); fillParts(true); rerender(); });
  $$('[data-gc]').forEach(el => el.onchange = () => { const k = el.dataset.gc, mx = GPARTS.find(x => x.k === k).max; G.counts[k] = Math.max(1, Math.min(mx, Math.floor(num(el.value)) || 1)); fillParts(false); rerender(); });
  $('#g-regen').onclick = () => { G.seed = Math.floor(Math.random()*1e6); fillParts(true); rerender(); };
  $$('[data-gmore]').forEach(b => b.onclick = () => { const k = b.dataset.gmore, mx = GPARTS.find(x => x.k === k).max; if(G.counts[k] >= mx){ toast('Максимум ' + mx + ' вариантов'); return; } G.counts[k]++; G.seed++; fillParts(false); rerender(); });
  $$('[data-glock]').forEach(b => b.onclick = () => { const [k, i] = b.dataset.glock.split('-'); const v = G.parts[k][+i]; v.lock = !v.lock; save(); b.setAttribute('aria-pressed', String(v.lock)); });
  $$('[data-gdel]').forEach(b => b.onclick = () => { const [k, i] = b.dataset.gdel.split('-'); if(G.parts[k].length <= 1){ toast('В части должен остаться хотя бы один вариант'); return; } G.parts[k].splice(+i, 1); G.counts[k] = G.parts[k].length; rerender(); });
  $('#g-prev').onclick = () => { genPrevDNA = genDNA(genLayers(), 9, Math.floor(Math.random()*1e6)); };
  $('#g-send').onclick = () => {
    const d = S.draft;
    d.layers = JSON.parse(JSON.stringify(genLayers())).map(L => ({...L, id:uid(), variants:L.variants.map(v => { const c = {...v, id:uid()}; delete c.lock; return c; })}));
    d.mode = 'layers'; d.legends = []; editIdx = null; rebuildDNA(); save();
    toast('Части перенесены в конструктор'); location.hash = 'create';
  };
}

function bindCollection(id){
  const b = $('#mint'); if(!b) return;
  b.onclick = () => {
    const c = col(id); if(!S.wallet) connect(); if(c.minted >= c.supply) return;
    const cost = r2(c.price + MINT_COST);
    if(S.near < cost){ $('#mint-err').textContent = `Не хватает NEAR: нужно ${fmt(cost)}, на балансе ${fmt(S.near)}.`; return; }
    S.near = r2(S.near - cost); c.minted++;
    const n = {id:uid(), col:c.id, n:c.minted, near:fillNear(c), tok:c.fill && c.fill.on && c.fill.tokOn ? c.fill.tokPer : 0, listed:false, listPrice:null};
    S.owned.unshift(n); save(); renderWallet(); toast(`Сминчено: ${c.name} #${n.n}`); location.hash = 'nft-' + n.id;
  };
}
function openHeld(colId, n){
  const c = col(colId); if(!c) return null;
  let o = S.owned.find(x => x.col === colId && x.n === n);
  if(!o){ o = {id:uid(), col:colId, n, near:c.fill && c.fill.on ? (c.fill.near || 0) : 0, tok:c.fill && c.fill.on && c.fill.tokOn ? c.fill.tokPer : 0, listed:false, listPrice:null, held:true}; S.owned.unshift(o); save(); }
  return o;
}
function bindNft(id){
  const n = nftById(id); if(!n) return; const c = col(n.col); if(!c) return;
  const msg = (t, cls='') => { const m = $('#msg'); if(m) m.innerHTML = `<p class="note ${cls}">${t}</p>`; };
  const dep = $('#dep-b'); if(dep) dep.onclick = () => { const a = num($('#dep').value);
    if(!(a > 0)) return msg('Введите сумму больше нуля.', 'warn'); if(a > S.near) return msg(`На балансе только ${fmt(S.near)} NEAR.`, 'warn');
    S.near = r2(S.near - a); n.near = r2(n.near + a); save(); renderWallet(); route(); toast(`Положено ${fmt(a)} NEAR`); };
  const wd = $('#wd'); if(wd) wd.onclick = () => {
    if(n.listed) return msg('NFT выставлена на продажу, поэтому забрать содержимое нельзя. Сначала снимите её с продажи.', 'warn');
    if(n.near <= 0 && n.tok <= 0) return msg('Внутри уже пусто.');
    const got = `${fmt(n.near)} NEAR${n.tok ? ' и ' + fmt(n.tok,0) + ' ' + esc(c.fill.tokSym) : ''}`;
    S.near = r2(S.near + n.near); if(n.tok) S.tokens[c.fill.tokSym] = (S.tokens[c.fill.tokSym] || 0) + n.tok;
    n.near = 0; n.tok = 0; save(); renderWallet(); route(); msg('В кошелёк переведено: ' + got, 'ok'); };
  const l = $('#lst'); if(l) l.onclick = () => { const p = num($('#lp').value); if(!(p > 0)) return; n.listed = true; n.listPrice = r2(p); save(); route(); toast('Выставлено на продажу'); };
  const u = $('#unl'); if(u) u.onclick = () => { n.listed = false; n.listPrice = null; save(); route(); toast('Снято с продажи'); };
}
function bindGuide(){ $$('[data-jump]').forEach(a => a.onclick = ev => { ev.preventDefault(); const el = document.getElementById(a.dataset.jump); if(el) el.scrollIntoView({behavior: reduced ? 'auto' : 'smooth'}); }); }
function bindMy(){
  const i2 = $('#in2'); if(i2) i2.onclick = () => { connect(); route(); };
  const t = $('#topup'); if(t) t.onclick = () => { S.near = r2(S.near + 100); save(); renderWallet(); route(); toast('Демо-баланс пополнен'); };
}

/* ---------- router ---------- */
function route(){
  const h = (location.hash || '#home').slice(1);
  if(h.startsWith('hold-')){
    const m = h.match(/^hold-([A-Za-z0-9]+)-(\d+)$/), o = m && S.wallet ? openHeld(m[1], +m[2]) : null;
    location.replace('#' + (o ? 'nft-' + o.id : 'my')); return;
  }
  let html, top = '', after = null;
  if(h === 'create'){ html = vCreate(); top = 'create'; after = bindCreate; }
  else if(h === 'guide'){ html = vGuide(); top = 'guide'; after = bindGuide; }
  else if(h === 'gen'){ if(!S.gen){ S.gen = newGen(); fillParts(true); save(); } genPreview(); html = vGen(); top = 'gen'; after = bindGen; }
  else if(h === 'explore'){ html = vExplore(); top = 'explore'; after = bindExplore; }
  else if(h === 'my'){ html = vMy(); top = 'my'; after = bindMy; }
  else if(h.startsWith('col-')){ const id = h.slice(4); html = vCollection(id); top = 'explore'; after = () => bindCollection(id); }
  else if(h.startsWith('nft-')){ const id = h.slice(4); html = vNft(id); top = 'my'; after = () => bindNft(id); }
  else { html = vHome(); top = 'home'; after = bindHome; }
  $('#view').innerHTML = html;
  $$('.nav a').forEach(a => { if(a.dataset.r === top) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  if(after) after();
  collect();
}
let last = location.hash;
addEventListener('hashchange', () => { route(); if(location.hash !== last) scrollTo(0, 0); last = location.hash; });
$('#q').addEventListener('input', ev => { query = ev.target.value; if((location.hash || '#home') !== '#explore') location.hash = 'explore'; else renderExplore(); });
startLang(); renderWallet(); route(); requestAnimationFrame(frame);
})();
</script>
